name: Bump opencode

# Checks npm every day for a new opencode release and opens a PR
# that only changes opencode.version.json.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check latest opencode
        id: check
        run: |
          latest=$(npm view opencode-ai version)
          current=$(node -p "require('./opencode.version.json').version")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Smoke test new version with the FPT config
        if: steps.check.outputs.latest != steps.check.outputs.current
        run: |
          echo "{ \"version\": \"${{ steps.check.outputs.latest }}\" }" > opencode.version.json
          npm ci
          npm run typecheck
          npm run build
          node scripts/smoke.mjs

      - name: Open pull request
        if: steps.check.outputs.latest != steps.check.outputs.current
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump-opencode-${{ steps.check.outputs.latest }}
          title: "Bump opencode ${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          commit-message: "Bump opencode to ${{ steps.check.outputs.latest }}"
          body: |
            opencode ${{ steps.check.outputs.latest }} is out.
            The smoke test passed: the binary downloads and loads the FPT Token Factory config.
            Release notes: https://github.com/anomalyco/opencode/releases
          add-paths: opencode.version.json
